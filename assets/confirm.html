<!DOCTYPE html>
<html lang="en">

      cellpadding="0"

          <table

            cellpadding="0"

          >
            <tr>
              <td style="padding-bottom: 20px">

              </td>
            </tr>
            <tr>
              <td

                  padding-bottom: 10px;

                Thank You for Contacting Me
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: sans-serif;

                  color: #555555;
                  line-height: 24px;
                "

                I have received your message and will respond as soon as I am
                able to.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 20px;
                  font-family: sans-serif;
                  font-size: 14px;
                  color: #aaaaaa;
                "
              >
                2025 Demetrios Kopatsis
              </td>
            </tr>
          </table>
        </td>
      </tr>
